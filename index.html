<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartera Diaria</title>
<meta name="description" content="Control de préstamos diarios: oficina, cobradores y clientes.">
<meta name="theme-color" content="#1F3FA8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartera Diaria">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF2; --ink:#141B26; --muted:#5B6574; --line:#D9DFE7;
  --pen:#1F3FA8; --pen-soft:#E3E9FB; --on-pen:#FFFFFF;
  --side:#111A2E; --side-ink:#C7D0E0; --side-active:rgba(255,255,255,.10);
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --warn:#A45F00; --warn-soft:#FBEBD1; --bad:#BF3328; --bad-soft:#FBE1DE;
  --s1:#2a78d6; --s1-soft:#86b6ef; --s2:#eb6834; --s3:#1baf7a; --grid:#E4E8EE; --axis:#C9D0DA;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --shadow:0 1px 2px rgba(20,27,38,.06),0 6px 20px rgba(20,27,38,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0E1319; --surface:#161D26; --surface2:#1E2733; --ink:#E7ECF2; --muted:#98A3B3; --line:#2A3441;
    --pen:#8FA6FF; --pen-soft:#1E2A52; --on-pen:#0E1319;
    --side:#0A0F15; --side-ink:#AEB9CA; --side-active:rgba(143,166,255,.14);
    --ok:#4CC38A; --ok-soft:#153325; --warn:#F2A945; --warn-soft:#3A2A12; --bad:#FF7A6E; --bad-soft:#3D1C1A;
    --s1:#3987e5; --s1-soft:#1c5cab; --s2:#d95926; --s3:#199e70; --grid:#243040; --axis:#34404F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E1319; --surface:#161D26; --surface2:#1E2733; --ink:#E7ECF2; --muted:#98A3B3; --line:#2A3441;
  --pen:#8FA6FF; --pen-soft:#1E2A52; --on-pen:#0E1319;
  --side:#0A0F15; --side-ink:#AEB9CA; --side-active:rgba(143,166,255,.14);
  --ok:#4CC38A; --ok-soft:#153325; --warn:#F2A945; --warn-soft:#3A2A12; --bad:#FF7A6E; --bad-soft:#3D1C1A;
  --s1:#3987e5; --s1-soft:#1c5cab; --s2:#d95926; --s3:#199e70; --grid:#243040; --axis:#34404F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 48px}
body.conbarra{padding-block:0 96px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:22px} h3{font-size:16px;font-weight:600}
.num,td.n,.money{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pen);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--on-pen)}
.brand b{font-family:var(--display);font-size:18px;font-weight:800;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tema{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--muted)}

.phone{max-width:480px;margin:0 auto}

/* Administración: menú lateral */
.admin{max-width:1280px;margin:18px auto 0;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.side{display:flex;gap:4px;overflow-x:auto;background:var(--side);border-radius:12px;padding:6px}
.side button{border:0;background:none;color:var(--side-ink);padding:9px 12px;border-radius:8px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:9px;text-align:left}
.side button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side button[aria-selected="true"]{background:var(--side-active);color:#fff}
.side .badge{margin-left:auto;background:var(--st-warn);color:#1A1200;border-radius:99px;font-size:11px;padding:0 7px;font-weight:800}
.side .sidehead{display:none}
@media (min-width:960px){
  .admin{grid-template-columns:230px minmax(0,1fr);align-items:start}
  .side{flex-direction:column;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));padding:12px;gap:2px;overflow:visible}
  .side .sidehead{display:block;color:var(--side-ink);opacity:.7;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:6px 12px 8px}
}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--display);font-size:clamp(21px,2.1vw,26px);font-weight:800;line-height:1.15;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:12.5px;color:var(--muted)}
.meter{height:6px;background:var(--pen-soft);border-radius:9px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--pen);border-radius:9px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel>h3{margin-bottom:10px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;justify-content:center;padding:13px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)} .c-pen{background:var(--pen-soft);color:var(--pen)}
.c-mut{background:var(--surface2);color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
table.compact{min-width:0}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tr.anulado td{color:var(--muted);text-decoration:line-through}
.bar{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--pen)}

/* Formularios */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-width:0}
.f textarea{resize:vertical;min-height:70px}
.f.full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.note{border-radius:10px;padding:10px 12px;font-size:13px}
.note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--pen-soft);color:var(--pen)} .note.warn{background:var(--warn-soft);color:var(--warn)}
.sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;background:var(--surface2);border-radius:10px;padding:12px}
.sim b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}

/* Tarjeta de cobro */
.tarjeta{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px}
.cell{border:1px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;font-size:10.5px;line-height:1.2;background:var(--surface);position:relative;min-height:42px}
.cell b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.cell.pag{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
.cell.pag::after{content:"✓";position:absolute;top:1px;right:4px;font-weight:800;font-size:11px}
.cell.par{background:linear-gradient(135deg,var(--pen-soft) 50%,var(--surface) 50%);color:var(--pen)}
.cell.ven{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.cell.hoy{outline:2px solid var(--pen);outline-offset:-1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Ruta del cobrador */
.hero{background:var(--pen);color:var(--on-pen);border-radius:16px;padding:18px;margin-top:16px}
.hero .big{font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .prog{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin:12px 0 6px}
.hero .prog i{display:block;height:100%;background:var(--on-pen)}
.hero .row{font-size:13px;opacity:.92}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.item .ord{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:12px}
.item.done{opacity:.72}
.item .t{font-weight:700}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sect{margin:18px 0 10px}

/* Barra inferior (apps móviles) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.bnav div{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;width:100%;max-width:480px}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:11.5px;font-weight:700;color:var(--muted)}
.bnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-selected="true"]{color:var(--pen);background:var(--pen-soft)}

/* Gráficas */
.viz{position:relative;min-height:210px}
.viz svg{display:block;width:100%;overflow:visible}
.viz text{font-family:var(--body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.vlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.vlegend span{display:inline-flex;align-items:center;gap:6px}
.vlegend i{width:10px;height:10px;border-radius:2px;display:inline-block}
details.tbl{margin-top:8px}
details.tbl summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--pen)}
details.tbl .tablewrap{margin-top:8px}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:12.5px;min-width:160px}
#tip .th{font-weight:700;margin-bottom:4px;color:var(--muted)}
#tip .tr{display:flex;align-items:center;gap:10px;justify-content:space-between}
#tip .tr span{display:flex;align-items:center;gap:6px;color:var(--muted)}
#tip .tr b{font-variant-numeric:tabular-nums}
#tip .key{width:12px;height:2px;border-radius:2px;display:inline-block}
.aging{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface)}
.aging i{display:block;height:100%;min-width:3px}
.agrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.agrow:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* Ventana */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){#modal{align-items:center}}
.sheet{background:var(--bg);border-radius:16px;width:100%;max-width:660px;max-height:88vh;overflow:auto;padding:18px;box-shadow:var(--shadow)}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.x{border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}

/* Recibo tipo impresora térmica */
.ticket{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 16px;width:100%;max-width:340px;margin:0 auto;white-space:pre-wrap;line-height:1.55;position:relative;overflow-wrap:anywhere}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 5px 0,var(--bg) 4px,transparent 4.5px) repeat-x;background-size:10px 8px}
.ticket::before{top:-1px} .ticket::after{bottom:-1px;transform:rotate(180deg)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#toast button{background:none;border:0;color:var(--bg);font-weight:800;text-decoration:underline}
.empty{padding:24px;text-align:center;color:var(--muted)}
.login{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.btn,.item,.seg button,.side button{transition:background .15s,border-color .15s}}

/* Ingreso */
.auth{max-width:420px;margin:32px auto 0;display:flex;flex-direction:column;gap:16px}
.authhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.authhead h1{font-size:30px}
.authhead p{margin:0}
.logo.big{width:56px;height:56px;border-radius:14px}
.logo.big svg{width:32px;height:32px}
.subtabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px}
.subtabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.note.demo{max-width:1280px;margin:14px auto 0}
.acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M13 13l1.5 1.5L17 12"/></svg></div>
    <div><b id="empresa">Cartera Diaria</b><span id="subtitulo">Control de préstamos</span></div>
  </div>
  <div class="seg" id="segRol" role="group" aria-label="Ver como" hidden>
    <button data-a="role" data-v="admin">Oficina</button>
    <button data-a="role" data-v="cobrador">Cobrador</button>
    <button data-a="role" data-v="cliente">Cliente</button>
  </div>
  <div class="acciones">
    <span id="red" class="chip" hidden></span>
    <button class="tema" data-a="instalar" id="btnInstalar" hidden>Instalar app</button>
    <button class="tema" data-a="tema" id="btnTema" aria-label="Cambiar tema">Tema: Auto</button>
    <button class="tema" data-a="salir" id="btnSalir" hidden>Salir</button>
  </div>
</header>
<main id="app"></main>
<nav class="bnav" id="bnav" hidden></nav>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>
<div id="tip" hidden></div>
<noscript>Activa JavaScript para usar Cartera Diaria.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
